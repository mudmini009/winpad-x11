# Windows-style Precision Touchpad gestures for X11/XFCE (winpad-gestures)
# Reload live with: killall -HUP winpad-gestures

# Touchpad evdev path ("auto" scans for any multitouch touchpad)
device = auto

# 2-finger horizontal flick (Back / Forward in browsers & file managers)
#   natural = swipe right -> Back, swipe left -> Forward (matches Windows Edge / Natural Scrolling)
#   arrow   = swipe left -> Back, swipe right -> Forward
#   off     = disable
two_finger_swipe = natural
two_finger_swipe_min_mm = 14
two_finger_swipe_max_ms = 360

# 3-finger horizontal swipe (Alt+Tab window switching)
#   alt_tab_scrub = hold Alt while swiping so you can slide between windows (Windows 10/11 style)
#   alt_tab_once  = single Alt+Tab tap per swipe
#   off           = disable
three_finger_horiz = alt_tab_scrub
# three_finger_direction: direct (Windows default: right=next/Tab, left=prev) | natural (left=next, right=prev)
three_finger_direction = direct
three_finger_thresh_mm = 6.5
three_finger_step_mm = 11.5
three_finger_v_thresh_mm = 7.5

# 4-finger horizontal swipe (Continuous multi-desktop switching; falls back to Alt+Tab if only 1 workspace)
#   workspace_direct  = Windows 11 default: swipe right -> next desktop, swipe left -> previous desktop
#   workspace_natural = swipe left -> next desktop, swipe right -> previous desktop
#   alt_tab           = swap windows
#   off               = disable
four_finger_horiz = workspace_direct
four_finger_thresh_mm = 7.5
four_finger_step_mm = 15.0

# 3-finger & 4-finger Swipe Up (from normal state) opens Task View
# Default uses lightweight native ~/.local/bin/winpad-taskview (can also use xfdashboard or rofi -show window)
taskview_cmd = ~/.local/bin/winpad-taskview
