<svg xmlns="http://www.w3.org/2000/svg" width="900" height="404" viewBox="0 0 900 404" fill="none">
  <rect width="900" height="404" rx="16" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="899" height="403" rx="15.5" stroke="#ffffff" stroke-opacity="0.10"/>

  <!-- Header -->
  <text x="30" y="36" fill="#f8fafc" font-family="Segoe UI, Ubuntu, sans-serif" font-size="18" font-weight="700">Precision Gesture Map</text>
  <text x="870" y="36" text-anchor="end" fill="#64748b" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12">Direct kernel evdev + native X11/XTest  •  0% idle CPU</text>

  <!-- Card 1 (Top-Left): 1 Finger -->
  <g transform="translate(28, 56)">
    <rect width="412" height="154" rx="12" fill="#141a28" stroke="#9ece6a" stroke-opacity="0.32"/>
    <circle cx="28" cy="28" r="13" fill="#9ece6a" fill-opacity="0.18"/>
    <text x="28" y="33" text-anchor="middle" fill="#9ece6a" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="800">1F</text>
    <text x="50" y="33" fill="#f1f5f9" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">One Finger</text>
    <rect x="306" y="17" width="88" height="22" rx="11" fill="#9ece6a" fill-opacity="0.12" stroke="#9ece6a" stroke-opacity="0.30"/>
    <text x="350" y="32" text-anchor="middle" fill="#b9f27c" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="700">60fps Glide</text>

    <text x="20" y="68" fill="#9ece6a" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700">Tap / Double-Tap &amp; Drag</text>
    <text x="20" y="86" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="12">Left click, drag windows, select text (libinput clickfinger)</text>

    <text x="20" y="116" fill="#9ece6a" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700">Edge / Corner Drag Auto-Slide</text>
    <text x="20" y="134" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="12">Hit touchpad border while dragging → keeps sliding smoothly</text>
  </g>

  <!-- Card 2 (Top-Right): 2 Fingers -->
  <g transform="translate(460, 56)">
    <rect width="412" height="154" rx="12" fill="#141a28" stroke="#7dcfff" stroke-opacity="0.34"/>
    <circle cx="28" cy="28" r="13" fill="#7dcfff" fill-opacity="0.18"/>
    <text x="28" y="33" text-anchor="middle" fill="#7dcfff" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="800">2F</text>
    <text x="50" y="33" fill="#f1f5f9" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">Two Fingers</text>
    <rect x="294" y="17" width="100" height="22" rx="11" fill="#7dcfff" fill-opacity="0.12" stroke="#7dcfff" stroke-opacity="0.30"/>
    <text x="344" y="32" text-anchor="middle" fill="#7dcfff" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="700">Scroll-Locked</text>

    <text x="20" y="68" fill="#7dcfff" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700">Tap &amp; Natural Scroll</text>
    <text x="20" y="86" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="12">Right click anywhere + smooth 2D Windows Natural Scroll</text>

    <text x="20" y="116" fill="#7dcfff" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700">Quick Horizontal Flick Left / Right</text>
    <text x="20" y="134" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="12">Forward / Back in browsers, files &amp; IDEs (auto-skips terminals)</text>
  </g>

  <!-- Card 3 (Bottom-Left): 3 Fingers -->
  <g transform="translate(28, 226)">
    <rect width="412" height="154" rx="12" fill="#141a28" stroke="#7aa2f7" stroke-opacity="0.45"/>
    <circle cx="28" cy="28" r="13" fill="#7aa2f7" fill-opacity="0.22"/>
    <text x="28" y="33" text-anchor="middle" fill="#7aa2f7" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="800">3F</text>
    <text x="50" y="33" fill="#f1f5f9" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">Three Fingers</text>
    <rect x="292" y="17" width="102" height="22" rx="11" fill="#7aa2f7" fill-opacity="0.14" stroke="#7aa2f7" stroke-opacity="0.35"/>
    <text x="343" y="32" text-anchor="middle" fill="#a5d6ff" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="700">End-Clamped</text>

    <text x="20" y="66" fill="#7aa2f7" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700">Tap → Super / Search</text>
    <text x="20" y="83" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11.5">Opens Whisker Menu (mutes middle-click)</text>

    <text x="20" y="112" fill="#7aa2f7" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700">Swipe Left / Right</text>
    <text x="20" y="129" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11.5">Alt+Tab scrub (stops at ends, XKB safe)</text>

    <!-- 3-state mini pill on right side of 3F card -->
    <rect x="242" y="54" width="152" height="84" rx="9" fill="#0d121d" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="318" y="74" text-anchor="middle" fill="#bb9af7" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">Task View (Up ↑)</text>
    <text x="318" y="92" text-anchor="middle" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="10.5">⇅ 3-State Cycle</text>
    <text x="318" y="109" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600">Normal  ⇄  Desktop</text>
    <text x="318" y="126" text-anchor="middle" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="9.5">(Up from Desktop restores)</text>
  </g>

  <!-- Card 4 (Bottom-Right): 4 Fingers -->
  <g transform="translate(460, 226)">
    <rect width="412" height="154" rx="12" fill="#141a28" stroke="#bb9af7" stroke-opacity="0.38"/>
    <circle cx="28" cy="28" r="13" fill="#bb9af7" fill-opacity="0.20"/>
    <text x="28" y="33" text-anchor="middle" fill="#bb9af7" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="800">4F</text>
    <text x="50" y="33" fill="#f1f5f9" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">Four Fingers</text>
    <rect x="278" y="17" width="116" height="22" rx="11" fill="#bb9af7" fill-opacity="0.14" stroke="#bb9af7" stroke-opacity="0.35"/>
    <text x="336" y="32" text-anchor="middle" fill="#d8b4fe" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="700">1 Swipe = 1 Desk</text>

    <text x="20" y="66" fill="#bb9af7" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700">Tap → Play/Pause (or Notifications)</text>
    <text x="20" y="83" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11.5">XF86AudioPlay by default (customizable in .conf)</text>

    <text x="20" y="112" fill="#bb9af7" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700">Swipe Left/Right &amp; Up/Down</text>
    <text x="20" y="129" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11.5">1-swipe Desktop switch + Fluent OSD  •  3-State Up/Down</text>
  </g>
</svg>
