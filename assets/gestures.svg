<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" fill="none">
  <rect width="900" height="340" rx="16" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="899" height="339" rx="15.5" stroke="#ffffff" stroke-opacity="0.10"/>

  <!-- Header -->
  <text x="32" y="38" fill="#f1f5f9" font-family="Segoe UI, Ubuntu, sans-serif" font-size="18" font-weight="700">Precision Gesture Map</text>
  <text x="868" y="38" text-anchor="end" fill="#64748b" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12">All multi-finger actions run natively in-process</text>

  <!-- Card 1: 2 Fingers -->
  <g transform="translate(28, 58)">
    <rect width="268" height="254" rx="12" fill="#151b28" stroke="#7dcfff" stroke-opacity="0.30"/>
    <circle cx="26" cy="28" r="12" fill="#7dcfff" fill-opacity="0.18"/>
    <text x="26" y="33" text-anchor="middle" fill="#7dcfff" font-family="Segoe UI, sans-serif" font-size="13" font-weight="800">2F</text>
    <text x="48" y="33" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">Two Fingers</text>

    <text x="20" y="72" fill="#7dcfff" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700">Tap</text>
    <text x="20" y="90" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="12">Right click anywhere (no hard press)</text>

    <text x="20" y="128" fill="#7dcfff" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700">Swipe Up / Down</text>
    <text x="20" y="146" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="12">Smooth Windows Natural Scroll</text>

    <text x="20" y="184" fill="#7dcfff" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700">Quick Flick Left / Right</text>
    <text x="20" y="202" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="12">Forward / Back in browsers &amp; files</text>
    <text x="20" y="220" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="11">(Auto-skips terminals &amp; vertical scroll)</text>
  </g>

  <!-- Card 2: 3 Fingers -->
  <g transform="translate(316, 58)">
    <rect width="268" height="254" rx="12" fill="#151b28" stroke="#7aa2f7" stroke-opacity="0.45"/>
    <circle cx="26" cy="28" r="12" fill="#7aa2f7" fill-opacity="0.22"/>
    <text x="26" y="33" text-anchor="middle" fill="#7aa2f7" font-family="Segoe UI, sans-serif" font-size="13" font-weight="800">3F</text>
    <text x="48" y="33" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">Three Fingers</text>

    <text x="20" y="72" fill="#7aa2f7" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700">Swipe Left / Right</text>
    <text x="20" y="90" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="12">Alt+Tab scrub (stops cleanly at ends)</text>
    <text x="20" y="107" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="11">(No wraparound + XKB layout safe)</text>

    <text x="20" y="144" fill="#7aa2f7" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700">Windows 3-State Up / Down</text>
    <rect x="20" y="156" width="228" height="78" rx="8" fill="#0f1420" stroke="#ffffff" stroke-opacity="0.07"/>
    <text x="134" y="176" text-anchor="middle" fill="#bb9af7" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700">Task View (Live Previews)</text>
    <text x="134" y="194" text-anchor="middle" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="11">↑ Up / Down ↓</text>
    <text x="134" y="210" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="600">Normal Windows  ⇄  Show Desktop</text>
    <text x="134" y="226" text-anchor="middle" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="10">(Swipe Up from Desktop restores windows)</text>
  </g>

  <!-- Card 3: 4 Fingers -->
  <g transform="translate(604, 58)">
    <rect width="268" height="254" rx="12" fill="#151b28" stroke="#bb9af7" stroke-opacity="0.35"/>
    <circle cx="26" cy="28" r="12" fill="#bb9af7" fill-opacity="0.20"/>
    <text x="26" y="33" text-anchor="middle" fill="#bb9af7" font-family="Segoe UI, sans-serif" font-size="13" font-weight="800">4F</text>
    <text x="48" y="33" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">Four Fingers</text>

    <text x="20" y="72" fill="#bb9af7" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700">Swipe Left / Right</text>
    <text x="20" y="90" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="12">One swipe per Virtual Desktop</text>
    <text x="20" y="107" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="11">(60fps Fluent OSD on primary monitor)</text>

    <text x="20" y="145" fill="#bb9af7" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700">Swipe Up / Down</text>
    <text x="20" y="163" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="12">Matches the 3-State Task View /</text>
    <text x="20" y="180" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="12">Show Desktop / Restore cycle</text>

    <rect x="20" y="200" width="228" height="34" rx="8" fill="#1e293b" fill-opacity="0.65"/>
    <text x="134" y="221" text-anchor="middle" fill="#9ece6a" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="600">45ms bounce-proof finger tracking</text>
  </g>
</svg>
