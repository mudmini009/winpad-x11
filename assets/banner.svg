<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#131926"/>
      <stop offset="100%" stop-color="#0e1420"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.78" cy="0.45" r="0.45">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.18" cy="0.80" r="0.40">
      <stop offset="0%" stop-color="#bb9af7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#bb9af7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7dcfff"/>
      <stop offset="50%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#bb9af7"/>
    </linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d2436"/>
      <stop offset="100%" stop-color="#141926"/>
    </linearGradient>
  </defs>

  <rect width="900" height="260" rx="18" fill="url(#bg)"/>
  <rect width="900" height="260" rx="18" fill="url(#glow1)"/>
  <rect width="900" height="260" rx="18" fill="url(#glow2)"/>
  <rect x="0.5" y="0.5" width="899" height="259" rx="17.5" stroke="#ffffff" stroke-opacity="0.10"/>

  <!-- Left Title & Badges -->
  <g transform="translate(52, 54)">
    <rect x="0" y="0" width="128" height="24" rx="12" fill="#7aa2f7" fill-opacity="0.16" stroke="#7aa2f7" stroke-opacity="0.45"/>
    <text x="64" y="16" text-anchor="middle" fill="#9eceff" font-family="Segoe UI, Ubuntu, Cantarell, sans-serif" font-size="11.5" font-weight="700">PURE C  •  X11 / XFCE</text>

    <text x="0" y="68" fill="#f1f5f9" font-family="Segoe UI, Ubuntu, Cantarell, sans-serif" font-size="46" font-weight="800" letter-spacing="-1">winpad-x11</text>
    <text x="0" y="102" fill="#94a3b8" font-family="Segoe UI, Ubuntu, Cantarell, sans-serif" font-size="15.5" font-weight="500">Windows 10/11 Precision Touchpad gestures &amp; Task View for Linux</text>

    <!-- Stat Pills -->
    <g transform="translate(0, 128)" font-family="Segoe UI, Ubuntu, Cantarell, sans-serif" font-size="12" font-weight="600">
      <rect x="0" y="0" width="98" height="28" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="49" y="18" text-anchor="middle" fill="#7dcfff">~5 MB RAM</text>

      <rect x="108" y="0" width="104" height="28" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="160" y="18" text-anchor="middle" fill="#7aa2f7">0% Idle CPU</text>

      <rect x="222" y="0" width="110" height="28" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="277" y="18" text-anchor="middle" fill="#bb9af7">Zero xdotool</text>

      <rect x="342" y="0" width="124" height="28" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="404" y="18" text-anchor="middle" fill="#9ece6a">Live Previews</text>
    </g>
  </g>

  <!-- Right Touchpad Graphic -->
  <g transform="translate(622, 42)">
    <rect x="0" y="0" width="228" height="176" rx="16" fill="url(#pad)" stroke="url(#accent)" stroke-opacity="0.55" stroke-width="1.6"/>
    <!-- Subtle inner grid / click split -->
    <line x1="16" y1="148" x2="212" y2="148" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    <line x1="114" y1="154" x2="114" y2="168" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

    <!-- Three-finger swipe up trails -->
    <path d="M69 114 L69 58" stroke="#7dcfff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.65"/>
    <path d="M114 108 L114 46" stroke="#7aa2f7" stroke-width="3" stroke-linecap="round" stroke-opacity="0.80"/>
    <path d="M159 114 L159 58" stroke="#bb9af7" stroke-width="3" stroke-linecap="round" stroke-opacity="0.65"/>

    <!-- Arrow heads -->
    <path d="M62 64 L69 55 L76 64" stroke="#7dcfff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M107 52 L114 43 L121 52" stroke="#7aa2f7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M152 64 L159 55 L166 64" stroke="#bb9af7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Touch points -->
    <circle cx="69" cy="116" r="11" fill="#7dcfff" fill-opacity="0.22" stroke="#7dcfff" stroke-width="2"/>
    <circle cx="69" cy="116" r="4.5" fill="#7dcfff"/>
    <circle cx="114" cy="110" r="11" fill="#7aa2f7" fill-opacity="0.24" stroke="#7aa2f7" stroke-width="2"/>
    <circle cx="114" cy="110" r="4.5" fill="#7aa2f7"/>
    <circle cx="159" cy="116" r="11" fill="#bb9af7" fill-opacity="0.22" stroke="#bb9af7" stroke-width="2"/>
    <circle cx="159" cy="116" r="4.5" fill="#bb9af7"/>
  </g>
</svg>
