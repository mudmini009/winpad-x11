<svg xmlns="http://www.w3.org/2000/svg" width="900" height="276" viewBox="0 0 900 276" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="276" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="52%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0c121e"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.035"/>
    </pattern>
    <radialGradient id="glow1" cx="0.78" cy="0.45" r="0.48">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.16" cy="0.82" r="0.42">
      <stop offset="0%" stop-color="#bb9af7" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#bb9af7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="0.45" cy="0.08" r="0.35">
      <stop offset="0%" stop-color="#7dcfff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7dcfff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7dcfff"/>
      <stop offset="50%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#bb9af7"/>
    </linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e273d"/>
      <stop offset="100%" stop-color="#131927"/>
    </linearGradient>
  </defs>

  <rect width="900" height="276" rx="18" fill="url(#bg)"/>
  <rect width="900" height="276" rx="18" fill="url(#dots)"/>
  <rect width="900" height="276" rx="18" fill="url(#glow1)"/>
  <rect width="900" height="276" rx="18" fill="url(#glow2)"/>
  <rect width="900" height="276" rx="18" fill="url(#glow3)"/>
  <rect x="0.5" y="0.5" width="899" height="275" rx="17.5" stroke="#ffffff" stroke-opacity="0.11"/>

  <!-- Left Title & Badges -->
  <g transform="translate(50, 44)">
    <rect x="0" y="0" width="136" height="24" rx="12" fill="#7aa2f7" fill-opacity="0.16" stroke="#7aa2f7" stroke-opacity="0.48"/>
    <text x="68" y="16" text-anchor="middle" fill="#a5d6ff" font-family="Segoe UI, Ubuntu, Cantarell, sans-serif" font-size="11" font-weight="700">PURE C11  •  X11 / XFCE</text>

    <rect x="146" y="0" width="58" height="24" rx="12" fill="#9ece6a" fill-opacity="0.14" stroke="#9ece6a" stroke-opacity="0.45"/>
    <text x="175" y="16" text-anchor="middle" fill="#b9f27c" font-family="Segoe UI, Ubuntu, Cantarell, sans-serif" font-size="11" font-weight="700">v1.5.0</text>

    <text x="0" y="72" fill="#f8fafc" font-family="Segoe UI, Ubuntu, Cantarell, sans-serif" font-size="48" font-weight="800" letter-spacing="-1.2">winpad-x11</text>
    <text x="0" y="106" fill="#94a3b8" font-family="Segoe UI, Ubuntu, Cantarell, sans-serif" font-size="15.5" font-weight="500">Windows 10/11 Precision Touchpad ergonomics &amp; Live Task View for Linux</text>

    <!-- Stat Pills -->
    <g transform="translate(0, 136)" font-family="Segoe UI, Ubuntu, Cantarell, sans-serif" font-size="12" font-weight="600">
      <rect x="0" y="0" width="96" height="30" rx="9" fill="#182235" stroke="#7dcfff" stroke-opacity="0.32"/>
      <text x="48" y="19" text-anchor="middle" fill="#7dcfff">~5 MB RAM</text>

      <rect x="106" y="0" width="102" height="30" rx="9" fill="#182235" stroke="#7aa2f7" stroke-opacity="0.32"/>
      <text x="157" y="19" text-anchor="middle" fill="#7aa2f7">0% Idle CPU</text>

      <rect x="218" y="0" width="108" height="30" rx="9" fill="#182235" stroke="#bb9af7" stroke-opacity="0.32"/>
      <text x="272" y="19" text-anchor="middle" fill="#bb9af7">Zero xdotool</text>

      <rect x="336" y="0" width="128" height="30" rx="9" fill="#182235" stroke="#9ece6a" stroke-opacity="0.32"/>
      <text x="400" y="19" text-anchor="middle" fill="#9ece6a">Live Previews</text>
    </g>
  </g>

  <!-- Right Touchpad Graphic -->
  <g transform="translate(612, 42)">
    <rect x="-4" y="-4" width="244" height="196" rx="20" stroke="url(#accent)" stroke-opacity="0.14" stroke-width="4"/>
    <rect x="0" y="0" width="236" height="188" rx="16" fill="url(#pad)" stroke="url(#accent)" stroke-opacity="0.62" stroke-width="1.6"/>
    <!-- Subtle inner edge-drag zone & click split -->
    <rect x="8" y="8" width="220" height="172" rx="11" stroke="#7dcfff" stroke-opacity="0.08" stroke-dasharray="4 4"/>
    <line x1="18" y1="158" x2="218" y2="158" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    <line x1="118" y1="164" x2="118" y2="178" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1"/>

    <!-- Three-finger swipe up trails -->
    <path d="M71 120 L71 58" stroke="#7dcfff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.72"/>
    <path d="M118 112 L118 44" stroke="#7aa2f7" stroke-width="3" stroke-linecap="round" stroke-opacity="0.88"/>
    <path d="M165 120 L165 58" stroke="#bb9af7" stroke-width="3" stroke-linecap="round" stroke-opacity="0.72"/>

    <!-- Arrow heads -->
    <path d="M64 65 L71 55 L78 65" stroke="#7dcfff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M111 51 L118 41 L125 51" stroke="#7aa2f7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M158 65 L165 55 L172 65" stroke="#bb9af7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Touch points -->
    <circle cx="71" cy="122" r="11" fill="#7dcfff" fill-opacity="0.22" stroke="#7dcfff" stroke-width="2"/>
    <circle cx="71" cy="122" r="4.5" fill="#7dcfff"/>
    <circle cx="118" cy="114" r="11" fill="#7aa2f7" fill-opacity="0.24" stroke="#7aa2f7" stroke-width="2"/>
    <circle cx="118" cy="114" r="4.5" fill="#7aa2f7"/>
    <circle cx="165" cy="122" r="11" fill="#bb9af7" fill-opacity="0.22" stroke="#bb9af7" stroke-width="2"/>
    <circle cx="165" cy="122" r="4.5" fill="#bb9af7"/>
  </g>
</svg>
