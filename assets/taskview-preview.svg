<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" fill="none">
  <defs>
    <linearGradient id="ovbg" x1="0" y1="0" x2="900" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1018"/>
      <stop offset="50%" stop-color="#121622"/>
      <stop offset="100%" stop-color="#0c0e16"/>
    </linearGradient>
    <linearGradient id="termgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161b26"/>
      <stop offset="100%" stop-color="#10141c"/>
    </linearGradient>
  </defs>

  <rect width="900" height="470" rx="16" fill="url(#ovbg)"/>
  <rect x="0.5" y="0.5" width="899" height="469" rx="15.5" stroke="#ffffff" stroke-opacity="0.12"/>

  <!-- Top Header -->
  <text x="36" y="44" fill="#f8fafc" font-family="Segoe UI, Ubuntu, sans-serif" font-size="22" font-weight="700">Task View</text>
  <text x="36" y="64" fill="#94a3b8" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12.5">Desktop 1 of 4  •  3 open windows</text>

  <!-- All Desktops Pill -->
  <rect x="762" y="28" width="102" height="28" rx="14" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.13"/>
  <text x="813" y="46" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="600">All Desktops</text>

  <!-- Center Window Cards (Current Desktop) -->
  <!-- Card 1 (Active Window) -->
  <g transform="translate(36, 94)">
    <rect width="262" height="202" rx="14" fill="#21283a" stroke="#7aa2f7" stroke-width="2"/>
    <circle cx="22" cy="22" r="7" fill="#7aa2f7"/>
    <text x="36" y="26" fill="#f1f5f9" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="600">Brave Browser</text>
    <rect x="206" y="13" width="24" height="17" rx="5" fill="#ffffff" fill-opacity="0.09"/>
    <text x="218" y="25" text-anchor="middle" fill="#a5b4fc" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700">D1</text>
    <text x="244" y="26" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">×</text>

    <rect x="12" y="40" width="238" height="148" rx="9" fill="#131823" stroke="#ffffff" stroke-opacity="0.09"/>
    <rect x="12" y="40" width="238" height="22" rx="9" fill="#1d2433"/>
    <rect x="30" y="46" width="140" height="10" rx="5" fill="#2c3548"/>
    <rect x="26" y="78" width="110" height="14" rx="4" fill="#7aa2f7" fill-opacity="0.45"/>
    <rect x="26" y="102" width="208" height="8" rx="4" fill="#334155"/>
    <rect x="26" y="118" width="184" height="8" rx="4" fill="#334155"/>
    <rect x="26" y="140" width="96" height="28" rx="6" fill="#1e293b" stroke="#7dcfff" stroke-opacity="0.35"/>
    <rect x="132" y="140" width="96" height="28" rx="6" fill="#1e293b"/>
  </g>

  <!-- Card 2 (Terminal) -->
  <g transform="translate(319, 94)">
    <rect width="262" height="202" rx="14" fill="#191d29" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="15" y="15" width="14" height="14" rx="3" fill="#22c55e" fill-opacity="0.85"/>
    <text x="36" y="26" fill="#f1f5f9" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="600">xfce4-terminal</text>
    <rect x="206" y="13" width="24" height="17" rx="5" fill="#ffffff" fill-opacity="0.09"/>
    <text x="218" y="25" text-anchor="middle" fill="#a5b4fc" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700">D1</text>
    <text x="244" y="26" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">×</text>

    <rect x="12" y="40" width="238" height="148" rx="9" fill="url(#termgrad)" stroke="#ffffff" stroke-opacity="0.09"/>
    <text x="24" y="66" fill="#9ece6a" font-family="monospace" font-size="11">$ winpad-gestures --check</text>
    <text x="24" y="84" fill="#7dcfff" font-family="monospace" font-size="10.5">TOUCHPAD_OK 5-finger</text>
    <text x="24" y="106" fill="#9ece6a" font-family="monospace" font-size="11">$ ps -o rss,comm</text>
    <text x="24" y="124" fill="#cbd5e1" font-family="monospace" font-size="10.5">2988  winpad-gestures</text>
    <text x="24" y="148" fill="#bb9af7" font-family="monospace" font-size="10.5">0.0% CPU idle</text>
  </g>

  <!-- Card 3 (Minimized Editor) -->
  <g transform="translate(602, 94)">
    <rect width="262" height="202" rx="14" fill="#191d29" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="15" y="15" width="14" height="14" rx="4" fill="#38bdf8" fill-opacity="0.85"/>
    <text x="36" y="26" fill="#f1f5f9" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="600">Code Editor</text>
    <rect x="206" y="13" width="24" height="17" rx="5" fill="#ffffff" fill-opacity="0.09"/>
    <text x="218" y="25" text-anchor="middle" fill="#a5b4fc" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700">D1</text>
    <text x="244" y="26" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">×</text>

    <rect x="12" y="40" width="238" height="148" rx="9" fill="#121520" stroke="#ffffff" stroke-opacity="0.09"/>
    <rect x="106" y="78" width="50" height="44" rx="10" fill="#38bdf8" fill-opacity="0.20" stroke="#38bdf8" stroke-opacity="0.65"/>
    <text x="131" y="106" text-anchor="middle" fill="#7dcfff" font-family="monospace" font-size="18" font-weight="700">&lt;/&gt;</text>
    <text x="131" y="160" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700">Minimized</text>
  </g>

  <!-- Bottom Windows 11 Virtual Desktops Dock -->
  <g transform="translate(106, 330)">
    <rect width="688" height="84" rx="16" fill="#0e111a" fill-opacity="0.86" stroke="#ffffff" stroke-opacity="0.10"/>

    <g transform="translate(16, 11)">
      <rect width="154" height="62" rx="12" fill="#2a3552" stroke="#7aa2f7" stroke-width="2"/>
      <text x="14" y="27" fill="#f1f5f9" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">Desktop 1</text>
      <text x="14" y="46" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="11">3 open windows</text>
    </g>

    <g transform="translate(182, 11)">
      <rect width="154" height="62" rx="12" fill="#1c212f" stroke="#ffffff" stroke-opacity="0.10"/>
      <text x="14" y="27" fill="#f1f5f9" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">Desktop 2</text>
      <text x="14" y="46" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11">1 open window</text>
    </g>

    <g transform="translate(348, 11)">
      <rect width="154" height="62" rx="12" fill="#1c212f" stroke="#ffffff" stroke-opacity="0.10"/>
      <text x="14" y="27" fill="#f1f5f9" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">Desktop 3</text>
      <text x="14" y="46" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="11">Empty</text>
    </g>

    <g transform="translate(514, 11)">
      <rect width="154" height="62" rx="12" fill="#1c212f" stroke="#ffffff" stroke-opacity="0.10"/>
      <text x="14" y="27" fill="#f1f5f9" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">Desktop 4</text>
      <text x="14" y="46" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="11">Empty</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="450" y="446" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12">
    Click window or desktop to switch  •  Type to filter  •  Ctrl+←/→ preview desktops  •  Esc / Swipe Down to exit
  </text>
</svg>
